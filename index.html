<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Constuction Measurement Converter</h1>

    <span>Pick a category </span>
    <select>
        <option class="length">LENGTH</option>
        <option class="weight">WEIGHT</option>
        <option class="volumn">VOLUME</option>
        <option class="temperature">Temperature</option>
    </select>


    <input type="text" id="number" placeholder="Enter a number">

    <label>FROM:</label>
    <select class="from">
        <option class="ft">Feet</option>
        <option class="in">Inches</option>
        <option class="yd">Yards</option>
        <option class="m">Meters</option>
        <option class="cm">centimeters</option>
        <option class="kg">Kilograms</option>
        <option class="g">Grams</option>
        <option class="mg">Mlilgrams</option>
        <option value="lb">LB(pounds)</option>
        <option value="oz"> Ounces</option>
        <option class=tbsp>Table Spoon</option>
        <option class=tsp>Teaspoon</option>
        <option class="L">Liter</option>
        <option class="ml">Milliliter</option>
        <option class="gal">Galon</option>
        <option class="qt">Quart</option>
        <option class="cup">Cups</option>
        <option class="fl oz"> Fluid Ounce</option>
        <option class="pt">Pint</option>
        <option class="c">Celsius</option>
        <option class="f">Fahrenheit</option>
    </select>


    <label>TO:</label>
    <select class="to">
        <option class="ft">Feet</option>
        <option class="in">Inches</option>
        <option class="yd">Yards</option>
        <option class="m">Meters</option>
        <option class="cm">centimeters</option>
        <option class="kg">Kilograms</option>
        <option class="g">Grams</option>
        <option class="mg">Mlilgrams</option>
        <option value="lb">pounds</option>
        <option value="oz"> Ounces</option>
        <option class=tbsp>Table Spoon</option>
        <option class=tsp>Teaspoon</option>
        <option class="L">Liter</option>
        <option class="ml">Milliliter</option>
        <option class="gal">Galon</option>
        <option class="qt">Quart</option>
        <option class="cup">Cups</option>
        <option class="fl oz"> Fluid Ounce</option>
        <option class="pt">Pint</option>
        <option class="c">Celsius</option>
        <option class="f">Fahrenheit</option>
    </select>

    <button>Get Meaurement</button>


    <section>

        <h2></h2>
        <p>Formula :</p>
    </section>









    <script src="script.js"></script>
</body>

</html>
